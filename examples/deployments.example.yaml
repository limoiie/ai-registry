# Project deployments template.
#
# Copy this file to .ai-registry/deployments.yaml in your project root and set
# the referenced environment variables. The built-in providers (deepseek,
# uniapi, uniapi-rerankers) ship with the package, so no provider file is
# needed unless you override or add a provider in .ai-registry/providers/.
profiles:
  - id: deepseek-primary
    provider_id: deepseek
    credential: {env: DEEPSEEK_API_KEY}
    enabled_models: [deepseek-chat, deepseek-reasoner]
  - id: uniapi-chat
    provider_id: uniapi
    credential: {env: UNIAPI_API_KEY}
    enabled_models: [deepseek-v4-flash, qwen3.5]
  - id: uniapi-embedding
    provider_id: uniapi
    credential: {env: UNIAPI_API_KEY}
    enabled_models: [bge-large-zh:latest]
  - id: uniapi-rerankers
    provider_id: uniapi-rerankers
    credential: {env: UNIAPI_API_KEY}
    enabled_models: [bge-reranker-v2-m3, qwen3-reranker:8b]
aliases:
  - id: chat-default
    deployments:
      - profile_id: deepseek-primary
        model_id: deepseek-chat
      - profile_id: uniapi-chat
        model_id: deepseek-v4-flash
  - id: embed-default
    deployments:
      - profile_id: uniapi-embedding
        model_id: bge-large-zh:latest
  - id: rerank-default
    deployments:
      - profile_id: uniapi-rerankers
        model_id: bge-reranker-v2-m3
