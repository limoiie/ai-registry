profiles:
  - id: builtin-deepseek
    provider_id: deepseek
    remark: builtin-deepseek
    description: "Built-in DeepSeek profile"
    api_key_env: DEEPSEEK_API_KEY
    enabled_models:
      - deepseek-chat
      - deepseek-reasoner
      - deepseek-v4-flash
      - deepseek-v4-pro
  - id: builtin-uniapi
    provider_id: uniapi
    remark: builtin
    description: "Built-in Uni API profile"
    api_key_env: UNIAPI_API_KEY
    enabled_models:
      - bge-large-zh:latest
      - deepseek-v4-flash
      # - deepseek-v3:671b
      # - deepseek-r1:671b
      # - deepseek-r1:671b-0528
      # - deepseek-r1:671b-64k
      # - deepseek-r1:32b
      - gpt-oss-120b
      # - gte-qwen2-7b
      - qwen3.5
      # - qwen3:235b
      - qwen3-embedding:8b
      - minimax-m27
  - id: builtin-uniapi-rerankers
    provider_id: uniapi-rerankers
    remark: builtin-rerankers
    description: "Built-in Uni API for Rerankers Only profile"
    api_key_env: UNIAPI_API_KEY
    enabled_models:
      - bge-reranker-v2-m3
      - qwen3-reranker:8b
  - id: builtin-minimax
    provider_id: minimax
    remark: builtin
    description: "Built-in Minimax"
    api_key_env: MINIMAX_API_KEY
    enabled_models:
      - MiniMax-M2.7
      - MiniMax-M2.5
      - MiniMax-M2.1
