id: zhipu
name: Zhipu AI (GLM)
description: Zhipu AI develops the GLM family of foundation models with strong Chinese
  and multilingual language support.
sdk_type: openai
default_base_url: https://open.bigmodel.cn/api/paas/v4
endpoints:
  openai:
    sdk_type: openai
    base_url: https://open.bigmodel.cn/api/paas/v4
    mode: chat
settings:
  url: https://www.zhipuai.cn
  check_model: glm-5.2
  models_url: https://open.bigmodel.cn/dev/howuse/model
  show_model_fetcher: true

models:
- id: glm-5.2
  display_name: GLM-5.2
  type: chat
  released_at: '2026-08-01'
  description: Latest GLM flagship with a 262K context window and strong reasoning
    and coding.
  context_window_tokens: 262144
  max_output_tokens: 262144
  capabilities:
    tools: true
    structured_output: true
    vision: true
    reasoning: true
  metadata:
    pricing:
      currency: USD
      units:
      - name: textInput
        rate: 1.4
        strategy: fixed
        unit: millionTokens
      - name: textOutput
        rate: 4.4
        strategy: fixed
        unit: millionTokens
