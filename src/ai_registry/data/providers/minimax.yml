id: minimax
name: Minimax
description: Founded in 2021, MiniMax builds general-purpose AI...
url: https://www.minimaxi.com
check_model: MiniMax-M2.1
models_url: https://platform.minimaxi.com/document/Models
settings:
  disable_browser_request: true
  proxy_url:
    placeholder: https://api.minimaxi.com
  response_animation:
    speed: 2
    text: smooth
  sdk_type: openai
  show_model_fetcher: false

