id: minimax
name: MiniMax
description: Founded in 2021, MiniMax builds general-purpose AI models and products
  spanning text, speech, and vision.
sdk_type: openai
default_base_url: https://api.minimaxi.com/v1
settings:
  url: https://www.minimaxi.com
  check_model: MiniMax-M3
  models_url: https://platform.minimaxi.com/document/Models
  disable_browser_request: true
  show_model_fetcher: false
  response_animation:
    speed: 2
    text: smooth

model_cards:
- id: MiniMax-M3
  display_name: MiniMax M3
  type: chat
  released_at: '2026-07-01'
  description: MiniMax's latest flagship model with 1M context, strong reasoning,
    coding, and agentic tool use.
  context_window_tokens: 1000000
  max_output_tokens: 128000
  capabilities:
    tools: true
    reasoning: true
  metadata:
    pricing:
      currency: USD
      units:
      - name: textInput
        rate: 0.5
        strategy: fixed
        unit: millionTokens
      - name: textOutput
        rate: 1.0
        strategy: fixed
        unit: millionTokens
