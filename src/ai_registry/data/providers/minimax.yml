id: minimax
name: MiniMax
description: Founded in 2021, MiniMax builds general-purpose AI models and products
  spanning text, speech, and vision.
# Model specs, pricing and capabilities come from the vendored models.dev
# snapshot (`ai-registry catalog sync`); these cards keep only deployment facts.
source: models.dev
endpoints:
  # MiniMax runs two deployments of the same API: the CN deployment on
  # api.minimax.cn and the international one on api.minimax.io. Each is reachable
  # over both compatibility protocols. The CN deployment also accepts
  # subscription keys from the CN Token Plan / M Plan (`sk-cp-...`, see
  # https://platform.minimax.cn/console/plan), which are not interchangeable with
  # pay-as-you-go API keys — an account picks the deployment with `endpoint_ref`
  # and supplies whichever key it has.
  cn-openai:
    sdk_type: openai
    base_url: https://api.minimax.cn/v1
    mode: chat
  cn-anthropic:
    sdk_type: anthropic
    base_url: https://api.minimax.cn/anthropic
    mode: chat
  intl-openai:
    sdk_type: openai
    base_url: https://api.minimax.io/v1
    mode: chat
  intl-anthropic:
    sdk_type: anthropic
    base_url: https://api.minimax.io/anthropic
    mode: chat
default_endpoint: cn-openai
settings:
  url: https://www.minimaxi.com
  check_model: MiniMax-M3
  models_url: https://platform.minimaxi.com/document/Models
  disable_browser_request: true
  show_model_fetcher: false
  response_animation:
    speed: 2
    text: smooth

# No model list: models.dev supplies the set, and both deployments serve it.