id: gemini
name: Google Gemini
description: Google DeepMind's Gemini family of multimodal models, including fast flash
  models and text embeddings.
sdk_type: google
default_base_url: https://generativelanguage.googleapis.com
settings:
  url: https://deepmind.google/technologies/gemini/
  check_model: gemini-3.6-flash
  models_url: https://ai.google.dev/gemini-api/docs/models
  show_model_fetcher: true

model_cards:
- id: gemini-3.6-flash
  display_name: Gemini 3.6 Flash
  type: chat
  released_at: '2026-07-01'
  description: Latest fast multimodal model with a 1M context window and strong reasoning
    and tool use.
  context_window_tokens: 1048576
  max_output_tokens: 65536
  capabilities:
    tools: true
    structured_output: true
    vision: true
    reasoning: true
  metadata:
    pricing:
      currency: USD
      units:
      - name: textInput
        rate: 2
        strategy: fixed
        unit: millionTokens
      - name: textOutput
        rate: 8
        strategy: fixed
        unit: millionTokens
