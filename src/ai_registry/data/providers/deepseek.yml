id: deepseek
name: DeepSeek
description: DeepSeek focuses on AI research and applications.
sdk_type: anthropic
default_base_url: https://api.deepseek.com/anthropic
endpoints:
  openai-chat:
    sdk_type: openai
    base_url: https://api.deepseek.com
    mode: chat
  openai-responses:
    sdk_type: openai
    base_url: https://api.deepseek.com
    mode: responses
  anthropic:
    sdk_type: anthropic
    base_url: https://api.deepseek.com/anthropic
    mode: chat
settings:
  url: https://deepseek.com
  check_model: deepseek-chat
  models_url: https://platform.deepseek.com/api-docs/quick_start/pricing
  show_model_fetcher: true

model_cards:
- id: deepseek-v4-flash
  display_name: DeepSeek V4 Flash
  type: chat
  released_at: '2026-04-24'
  description: DeepSeek V4 Flash is a fast, cost-effective 284B MoE model with 1M context,
    optional thinking mode, and strong agentic performance for high-volume workloads.
  context_window_tokens: 1000000
  max_output_tokens: 384000
  endpoints: [openai-chat, openai-responses, anthropic]
  capabilities:
    tools: true
    reasoning: true
    structured_output: true
  metadata:
    pricing:
      currency: USD
      units:
      - name: textInput_cacheRead
        rate: 0.0028
        strategy: fixed
        unit: millionTokens
      - name: textInput
        rate: 0.14
        strategy: fixed
        unit: millionTokens
      - name: textOutput
        rate: 0.28
        strategy: fixed
        unit: millionTokens
