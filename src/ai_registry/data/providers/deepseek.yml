id: deepseek
name: DeepSeek
description: DeepSeek focuses on AI research and applications.
# Model specs, pricing and capabilities come from the vendored models.dev
# snapshot (`ai-registry catalog sync`); these cards keep only deployment facts.
source: models.dev
endpoints:
  openai-chat:
    sdk_type: openai
    base_url: https://api.deepseek.com
    mode: chat
  openai-responses:
    sdk_type: openai
    base_url: https://api.deepseek.com
    mode: responses
  anthropic:
    sdk_type: anthropic
    base_url: https://api.deepseek.com/anthropic
    mode: chat
default_endpoint: anthropic
settings:
  url: https://deepseek.com
  check_model: deepseek-v4-flash
  models_url: https://platform.deepseek.com/api-docs/quick_start/pricing
  show_model_fetcher: true

models:
# Deployment facts models.dev does not carry: which protocol surfaces serve each
# model. Models without an entry are reachable on every endpoint.
- id: deepseek-v4-flash
  endpoints: [openai-chat, openai-responses, anthropic]
- id: deepseek-v4-pro
  endpoints: [openai-chat, anthropic]