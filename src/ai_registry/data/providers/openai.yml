id: openai
name: OpenAI
description: OpenAI develops frontier GPT models, reasoning models, and text embeddings.
endpoints:
  openai:
    sdk_type: openai
    base_url: https://api.openai.com/v1
    mode: chat
settings:
  url: https://openai.com
  check_model: gpt-5.6
  models_url: https://platform.openai.com/docs/pricing
  show_model_fetcher: true

models:
- id: gpt-5.6
  display_name: GPT-5.6
  type: chat
  released_at: '2026-07-09'
  description: OpenAI's latest flagship model with a 1M context window and advanced
    reasoning, coding, and multimodal abilities.
  context_window_tokens: 1050000
  max_output_tokens: 128000
  capabilities:
    tools: true
    structured_output: true
    vision: true
    reasoning: true
  metadata:
    pricing:
      currency: USD
