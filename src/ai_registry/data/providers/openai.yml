id: openai
name: OpenAI
description: OpenAI develops frontier GPT models, reasoning models, and text embeddings.
# Model specs, pricing and capabilities come from the vendored models.dev
# snapshot (`ai-registry catalog sync`); these cards keep only deployment facts.
source: models.dev
endpoints:
  openai:
    sdk_type: openai
    base_url: https://api.openai.com/v1
    mode: chat
settings:
  url: https://openai.com
  check_model: gpt-5.6
  models_url: https://platform.openai.com/docs/pricing
  show_model_fetcher: true

models:
# models.dev reports no vector dimension, so the embedding cards declare it.
- id: text-embedding-3-large
  embedding_dimension: 3072
- id: text-embedding-3-small
  embedding_dimension: 1536