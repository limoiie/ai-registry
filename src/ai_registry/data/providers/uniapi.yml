id: uniapi
name: Uni API
description: OpenAI-compatible gateway aggregating open-weight chat, embedding, and
  reranking models.
endpoints:
  openai:
    sdk_type: openai
    base_url: https://uni-api.cstcloud.cn/v1
    mode: chat
settings:
  url: https://www.cstcloud.cn
  check_model: deepseek-v4-flash
  models_url: https://uni-api.cstcloud.cn/doc/llm/models
  show_model_fetcher: true

models:
- id: deepseek-v3:671b
  display_name: DeepSeek V3 671B 0324
  type: chat
  released_at: '2025-03-24'
  description: DeepSeek V3 671B 0324 version with a 64K context window.
  context_window_tokens: 65536
  max_output_tokens: 8192
  capabilities:
    tools: true
    structured_output: true
  metadata:
    pricing:
      currency: CNY
      units:
      - name: textInput_cacheRead
        rate: 0
        strategy: fixed
        unit: millionTokens
      - name: textInput
        rate: 0
        strategy: fixed
        unit: millionTokens
      - name: textOutput
        rate: 0
        strategy: fixed
        unit: millionTokens
- id: qwen3-embedding:8b
