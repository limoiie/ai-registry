id: uniapi
name: Uni API
description: OpenAI-compatible gateway aggregating open-weight chat, embedding, and
  reranking models.
sdk_type: openai
default_base_url: https://uni-api.cstcloud.cn
endpoints:
  openai:
    sdk_type: openai
    base_url: https://uni-api.cstcloud.cn
    mode: chat
settings:
  url: https://www.cstcloud.cn
  check_model: deepseek-v4-flash
  models_url: https://uni-api.cstcloud.cn/doc/llm/models
  show_model_fetcher: true

models:
- id: bge-large-zh:latest
  display_name: BGE Large ZH Latest
  type: embedding
  released_at: '2025-02-18'
  description: BGE large zh embedding model.
  context_window_tokens: 524288
  embedding_dimension: 1024
  metadata:
    pricing:
      currency: CNY
      units:
      - name: textInput
        rate: 0
        strategy: fixed
        unit: millionTokens
