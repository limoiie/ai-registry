id: google
name: Google Gemini
description: Google DeepMind's Gemini family of multimodal models, including fast flash
  models and text embeddings.
# Model specs, pricing and capabilities come from the vendored models.dev
# snapshot (`ai-registry catalog sync`); these cards keep only deployment facts.
source: models.dev
endpoints:
  google:
    sdk_type: google
    base_url: https://generativelanguage.googleapis.com
    mode: chat
settings:
  url: https://deepmind.google/technologies/gemini/
  check_model: gemini-3.6-flash
  models_url: https://ai.google.dev/gemini-api/docs/models
  show_model_fetcher: true

models:
# models.dev reports no vector dimension, so the embedding cards declare it.
- id: gemini-embedding-001
  embedding_dimension: 3072
- id: gemini-embedding-2
  embedding_dimension: 3072