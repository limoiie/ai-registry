id: anthropic
name: Anthropic
description: Anthropic builds Claude, a family of frontier AI models for enterprise
  reasoning, coding, and agentic work.
# Model specs, pricing and capabilities come from the vendored models.dev
# snapshot (`ai-registry catalog sync`); these cards keep only deployment facts.
source: models.dev
endpoints:
  anthropic:
    sdk_type: anthropic
    base_url: https://api.anthropic.com
    mode: chat
settings:
  url: https://www.anthropic.com
  check_model: claude-sonnet-5
  models_url: https://docs.anthropic.com/en/docs/about-claude/models/overview
  show_model_fetcher: true

# No model list: models.dev supplies the set.