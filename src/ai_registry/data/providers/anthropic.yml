id: anthropic
name: Anthropic
description: Anthropic builds Claude, a family of frontier AI models for enterprise
  reasoning, coding, and agentic work.
endpoints:
  anthropic:
    sdk_type: anthropic
    base_url: https://api.anthropic.com
    mode: chat
settings:
  url: https://www.anthropic.com
  check_model: claude-sonnet-5
  models_url: https://docs.anthropic.com/en/docs/about-claude/models/overview
  show_model_fetcher: true

models:
- id: claude-opus-5
  display_name: Claude Opus 5
  type: chat
  released_at: '2026-06-18'
  description: Anthropic's most capable model with a 1M context window and frontier
    reasoning, coding, and long-horizon agent performance.
  context_window_tokens: 1000000
  max_output_tokens: 128000
  capabilities:
    tools: true
    structured_output: true
    vision: true
    reasoning: true
  metadata:
    pricing:
      currency: USD
      units:
      - name: textInput
        rate: 5
        strategy: fixed
        unit: millionTokens
      - name: textOutput
        rate: 25
        strategy: fixed
        unit: millionTokens
