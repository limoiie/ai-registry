id: xai
name: xAI (Grok)
description: xAI develops the Grok family of frontier models with very large context
  windows and strong reasoning and coding performance.
# Model specs, pricing and capabilities come from the vendored models.dev
# snapshot (`ai-registry catalog sync`); these cards keep only deployment facts.
source: models.dev
endpoints:
  openai:
    sdk_type: openai
    base_url: https://api.x.ai/v1
    mode: chat
settings:
  url: https://x.ai
  check_model: grok-4.5
  models_url: https://docs.x.ai/docs/models
  show_model_fetcher: true

# No model list: models.dev supplies the set.