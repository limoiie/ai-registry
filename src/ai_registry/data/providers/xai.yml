id: xai
name: xAI (Grok)
description: xAI develops the Grok family of frontier models with very large context
  windows and strong reasoning and coding performance.
sdk_type: openai
default_base_url: https://api.x.ai/v1
endpoints:
  openai:
    sdk_type: openai
    base_url: https://api.x.ai/v1
    mode: chat
settings:
  url: https://x.ai
  check_model: grok-4.5
  models_url: https://docs.x.ai/docs/models
  show_model_fetcher: true

models:
- id: grok-4.5
  display_name: Grok 4.5
  type: chat
  released_at: '2026-06-01'
  description: Latest Grok flagship with a 500K context window and frontier reasoning.
  context_window_tokens: 500000
  max_output_tokens: 500000
  capabilities:
    tools: true
    structured_output: true
    vision: true
    reasoning: true
  metadata:
    pricing:
      currency: USD
      units:
      - name: textInput
        rate: 2
        strategy: fixed
        unit: millionTokens
      - name: textOutput
        rate: 6
        strategy: fixed
        unit: millionTokens
- id: grok-4.3
  display_name: Grok 4.3
  type: chat
