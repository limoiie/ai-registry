id: uniapi-rerankers
name: Uni API for Rerankers Only
description: OpenAI-compatible reranking models served through the Uni API gateway.
endpoints:
  openai:
    sdk_type: openai
    base_url: https://uni-api.cstcloud.cn/v1
    mode: chat
settings:
  url: https://www.cstcloud.cn
  check_model: bge-reranker-v2-m3
  models_url: https://uni-api.cstcloud.cn/doc/llm/models
  show_model_fetcher: true

models:
- id: bge-reranker-v2-m3
  display_name: BGE Reranker V2 M3
  type: reranking
  released_at: '2025-04-11'
  description: BGE reranker v2 m3 model.
  context_window_tokens: 131072
  metadata:
    pricing:
      currency: CNY
      units:
      - name: textInput
        rate: 0
        strategy: fixed
        unit: millionTokens
- id: qwen3-reranker:8b
  display_name: Qwen3 Reranker 8B
  type: reranking
  released_at: '2025-07-11'
  description: Qwen3 reranker model with 4096-dim embeddings and a 32K context window.
  context_window_tokens: 32768
  metadata:
    pricing:
      currency: CNY
      units:
      - name: textInput
        rate: 0
        strategy: fixed
        unit: millionTokens