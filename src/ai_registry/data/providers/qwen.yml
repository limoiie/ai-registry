id: qwen
name: Qwen (Alibaba Cloud)
description: Alibaba Cloud's Qwen family of open-weight and API models, including
  chat, vision-language, and embedding models.
endpoints:
  openai:
    sdk_type: openai
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    mode: chat
settings:
  url: https://qwenlm.github.io
  check_model: qwen3.8-max
  models_url: https://help.aliyun.com/zh/model-studio/models
  show_model_fetcher: true

models:
- id: qwen3.8-max
  display_name: Qwen3.8 Max
  type: chat
  released_at: '2026-08-03'
  description: Alibaba's strongest API model with a 1M context window and frontier
    reasoning and agentic performance.
  context_window_tokens: 991808
  max_output_tokens: 131072
  capabilities:
    tools: true
    structured_output: true
    vision: true
    reasoning: true
  metadata:
    pricing:
      currency: USD
      units:
      - name: textInput
        rate: 3
        strategy: fixed
        unit: millionTokens
      - name: textOutput
        rate: 9
        strategy: fixed
        unit: millionTokens
