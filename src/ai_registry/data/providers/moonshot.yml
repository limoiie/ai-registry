id: moonshot
name: Moonshot (Kimi)
description: Moonshot AI develops the Kimi family of large language models with long
  context windows and strong agentic tool use.
endpoints:
  openai:
    sdk_type: openai
    base_url: https://api.moonshot.ai/v1
    mode: chat
settings:
  url: https://www.moonshot.ai
  check_model: kimi-k3
  models_url: https://platform.moonshot.ai/docs/pricing
  show_model_fetcher: true

models:
- id: kimi-k3
  display_name: Kimi K3
  type: chat
  released_at: '2026-08-01'
  description: Next-generation Kimi flagship with a 256K context window and frontier
    reasoning and agentic performance.
  context_window_tokens: 262144
  max_output_tokens: 262144
  capabilities:
    tools: true
    structured_output: true
    vision: true
    reasoning: true
  metadata:
    pricing:
      currency: USD
      units:
      - name: textInput
        rate: 1.5
        strategy: fixed
        unit: millionTokens
      - name: textOutput
        rate: 6
        strategy: fixed
        unit: millionTokens
