name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --frozen --group docs

      - name: Stage docs entry points
        run: |
          # README links are repo-relative ("docs/overview.md"). Once the file
          # is copied *into* docs/, strip the prefix so the links resolve.
          # LICENSE has no docs page, so point it at the file on GitHub.
          sed -e 's|](docs/|](|g' \
              -e 's|](LICENSE)|](https://github.com/limoiie/ai-registry/blob/main/LICENSE)|g' \
              README.md > docs/index.md
          cp CHANGELOG.md docs/changelog.md

      - run: uv run --frozen mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
