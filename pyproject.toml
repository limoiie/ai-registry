[build-system]
requires = ["uv-build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[project]
name = "ai-registry"
version = "0.1.0"
description = "Framework-independent AI provider registry core."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
default-groups = ["dev"]
package-data = ["src/ai_registry/data/providers/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
